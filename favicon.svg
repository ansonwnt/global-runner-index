<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#07070f"/>
  <!-- Running figure -->
  <!-- Head -->
  <circle cx="20" cy="6.5" r="2.2" fill="#00e676"/>
  <!-- Body / torso -->
  <line x1="20" y1="8.7" x2="17.5" y2="15" stroke="#00e676" stroke-width="2" stroke-linecap="round"/>
  <!-- Forward arm -->
  <line x1="19.5" y1="11" x2="23.5" y2="13.5" stroke="#00e676" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Back arm -->
  <line x1="19" y1="11.5" x2="15.5" y2="9.5" stroke="#00e676" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Forward leg -->
  <line x1="17.5" y1="15" x2="21" y2="20" stroke="#00e676" stroke-width="2" stroke-linecap="round"/>
  <line x1="21" y1="20" x2="24.5" y2="21" stroke="#00e676" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Back leg -->
  <line x1="17.5" y1="15" x2="14.5" y2="20" stroke="#00e676" stroke-width="2" stroke-linecap="round"/>
  <line x1="14.5" y1="20" x2="12" y2="18.5" stroke="#00e676" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Ground line -->
  <line x1="8" y1="25" x2="26" y2="25" stroke="#00e676" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
</svg>
